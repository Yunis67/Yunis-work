<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="./gsap.min.js"></script>
    <style>
      @font-face { font-family: "Archivo Black"; src: url("fonts/ArchivoBlack-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Instrument Serif"; src: url("fonts/InstrumentSerif-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("fonts/Inter-700.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "JetBrains Mono"; src: url("fonts/JetBrainsMono-400.woff2") format("woff2"); font-weight: 400; }

      :root {
        --ink: #0b0a12;
        --cream: #f3efe6;
        --brand: #5b41da;
        --brand-deep: #3f2ba6; /* brand purple, darkened for text on the light wall */
        --peri: #8f7bff;
        --red: #ff5a5f;
        --green: #34c759;
        --muted: #8b88a0;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Inter", sans-serif; }
      .clip { position: absolute; inset: 0; }

      #vid-wrap { position: absolute; inset: 0; transform-origin: 1060px 470px; }
      #src { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }

      .mono { font-family: "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.16em; }
      .serif { font-family: "Instrument Serif", serif; font-style: italic; }
      .heavy { font-family: "Archivo Black", sans-serif; text-transform: uppercase; line-height: 1; letter-spacing: -0.01em; }
      .mask { display: block; overflow: hidden; }
      .mask > span { display: inline-block; }
      .pdot { display: inline-block; width: 0.2em; height: 0.2em; border-radius: 50%; background: currentColor; margin-left: 0.06em; vertical-align: baseline; }

      /* radial tick ring (built in JS) */
      .ticks { position: absolute; width: 0; height: 0; }
      .ticks i { position: absolute; left: 0; top: 0; display: block; opacity: 0; }

      /* 01 · name lockup */
      #orbit { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }
      #name { position: absolute; left: 1475px; top: 318px; width: 380px; text-align: center; font-size: 84px; color: var(--ink); white-space: nowrap; }
      #name span { display: inline-block; }
      #from-mask { position: absolute; right: 154px; top: 430px; height: 78px; overflow: hidden; }
      #from { display: block; font-size: 60px; line-height: 60px; color: var(--brand-deep); white-space: nowrap; }
      #o-ring { position: absolute; left: 1769px; top: 449px; width: 31px; height: 31px; border-radius: 50%; border: 4px solid var(--brand-deep); }
      #tk1 { left: 1784.5px; top: 464.5px; }
      #tk1 i { width: 2px; height: 7px; margin: -3.5px 0 0 -1px; background: var(--ink); border-radius: 1px; }
      #tk1 i.maj { height: 13px; margin-top: -6.5px; }
      #tag-in { position: absolute; left: 1640px; top: 515px; font-size: 13px; color: var(--ink); opacity: 0; }

      /* 02 · dot → glowing pill → notification */
      #shape { position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 13px; background: var(--brand); overflow: hidden; }
      #notif { position: absolute; left: 0; top: 0; width: 420px; height: 96px; padding: 20px 22px; display: flex; gap: 16px; align-items: center; color: var(--cream); opacity: 0; }
      #notif .ic { width: 56px; height: 56px; border-radius: 15px; background: var(--brand); display: flex; align-items: center; justify-content: center; gap: 4px; flex: none; }
      #notif .ic b { display: block; width: 5px; border-radius: 3px; background: #fff; }
      #notif .tx { flex: 1; min-width: 0; }
      #notif .l1 { display: flex; justify-content: space-between; font-weight: 700; font-size: 20px; line-height: 24px; }
      #notif .l1 span { font-weight: 400; font-size: 16px; color: var(--muted); }
      #notif .l2 { font-size: 18px; line-height: 24px; margin-top: 4px; color: #d9d5e8; white-space: nowrap; }
      #confirm { position: absolute; left: 1475px; top: 478px; padding: 10px 18px 10px 14px; border-radius: 999px; background: var(--green); color: var(--ink); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; display: flex; align-items: center; gap: 8px; opacity: 0; box-shadow: 0 12px 30px rgba(52,199,89,0.35); }
      #confirm svg { width: 18px; height: 18px; }

      /* 03 · what / how / why */
      #dots { position: absolute; left: 1462px; top: 280px; width: 420px; height: 420px; }
      #dots i { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--peri); opacity: 0; }
      .row3 { position: absolute; left: 1480px; display: flex; align-items: baseline; gap: 10px; }
      .row3 .n { width: 26px; font-size: 17px; color: var(--ink); opacity: 0; }
      .row3 .wwrap { position: relative; display: inline-block; }
      .row3 .w { display: inline-block; font-size: 96px; color: var(--ink); }
      .row3 .ul { position: absolute; left: 0; right: 22px; bottom: -10px; height: 7px; background: var(--brand-deep); transform-origin: 0 50%; }
      #speak-mask { position: absolute; left: 1480px; top: 660px; height: 66px; overflow: hidden; }
      #speak { display: block; font-size: 44px; line-height: 50px; color: var(--brand-deep); }

      /* cutaways */
      .cut { z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
      .wall { position: absolute; left: -400px; top: -500px; width: 2720px; height: 2080px; transform: rotate(-12deg); display: flex; flex-direction: column; justify-content: center; gap: 6px; pointer-events: none; }
      .wall div { font-family: "Archivo Black", sans-serif; text-transform: uppercase; font-size: 132px; line-height: 1.05; white-space: nowrap; color: transparent; -webkit-text-stroke: 1.5px var(--wall); }
      .cut .fg { position: relative; display: flex; flex-direction: column; align-items: center; }
      #cut-ov { --wall: rgba(243,239,230,0.2); background: radial-gradient(1100px 700px at 50% 50%, #6c53ee 0%, var(--brand) 60%); color: var(--cream); }
      #cut-ov .heavy { font-size: 230px; }
      #cut-ov .serif { font-size: 64px; color: rgba(243,239,230,0.85); }
      #cut-ov .mask { margin-top: 18px; padding-bottom: 14px; }
      #cut-same { --wall: rgba(143,123,255,0.32); background: radial-gradient(1000px 650px at 50% 50%, #1d1638 0%, var(--ink) 70%); color: var(--cream); }
      #cut-same .heavy { font-size: 190px; line-height: 0.95; }
      #same-b { color: var(--peri); }
      #cut-every { background: var(--cream); color: var(--ink); }
      #cut-single { background: var(--ink); color: var(--cream); }
      #cut-day { background: radial-gradient(1100px 700px at 50% 50%, #6c53ee 0%, var(--brand) 60%); color: var(--cream); }
      .big { font-size: 300px; }
      #day-dot { position: relative; transform-origin: 0% 100%; }
      #day-dot svg { position: absolute; left: 50%; top: 50%; width: 46%; height: 46%; transform: translate(-50%, -50%); opacity: 0; }
      #tk2 { left: 50%; top: 50%; }
      #tk2 i { width: 1px; height: 4px; margin: -2px 0 0 -0.5px; background: var(--cream); border-radius: 1px; }
      #tk2 i.maj { height: 8px; margin-top: -4px; }
      #orbiters { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
      #orbiters i { position: absolute; width: 4px; height: 4px; margin: -2px 0 0 -2px; border-radius: 50%; background: var(--cream); }

      /* HUD */
      #hud { position: absolute; inset: 0; z-index: 100; pointer-events: none; color: var(--ink); }
      #hud.on-footage .hl:not(#hl-bl), #hud.on-footage #hl-bl span { background: rgba(243,239,230,0.88); padding: 5px 9px; margin: -5px -9px; border-radius: 3px; }
      #hud.on-dark { color: var(--cream); }
      #hud.on-light { color: var(--ink); }
      .hud-in { opacity: 0; }
      .br { position: absolute; width: 26px; height: 26px; border-color: currentColor; border-style: solid; border-width: 0; }
      #br-tl { left: 36px; top: 36px; border-top-width: 2px; border-left-width: 2px; transform-origin: 0 0; }
      #br-tr { right: 36px; top: 36px; border-top-width: 2px; border-right-width: 2px; transform-origin: 100% 0; }
      #br-bl { left: 36px; bottom: 36px; border-bottom-width: 2px; border-left-width: 2px; transform-origin: 0 100%; }
      #br-br { right: 36px; bottom: 36px; border-bottom-width: 2px; border-right-width: 2px; transform-origin: 100% 100%; }
      .hl { position: absolute; font-size: 16px; line-height: 18px; white-space: nowrap; }
      #hl-tl { left: 76px; top: 46px; }
      #hl-tr { right: 76px; top: 46px; display: flex; align-items: center; gap: 10px; }
      #rec { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
      #hl-bl { left: 76px; bottom: 56px; display: grid; }
      #hl-bl span { grid-area: 1 / 1; justify-self: start; opacity: 0; }
      #hl-bl em { font-style: normal; opacity: 0.55; margin-left: 14px; }
      #hl-br { right: 76px; bottom: 56px; display: flex; align-items: center; gap: 12px; }
      #beats { display: flex; gap: 4px; }
      #beats i { display: block; width: 10px; height: 10px; border: 1.5px solid currentColor; }
      #prog-track { position: absolute; left: 76px; right: 76px; bottom: 44px; height: 1px; background: currentColor; opacity: 0.3; }
      #prog { position: absolute; left: 76px; right: 76px; bottom: 43px; height: 3px; background: currentColor; transform-origin: 0 50%; transform: scaleX(0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1920" data-height="1080">

      <!-- FOOTAGE (0 to 16s), sound stays on the clip -->
      <div id="vid-wrap">
        <video id="src" class="clip" src="source.mp4" data-start="0" data-duration="16" data-has-audio="true" playsinline></video>
      </div>

      <!-- 01 / HELLO (0.6 to 4.2s): name on an orbit line; the "o" in RezFlo becomes a dot with a tick ring -->
      <div id="ch1" class="clip" data-start="0" data-duration="4.3" style="z-index:10">
        <svg id="orbit" viewBox="0 0 1920 1080">
          <ellipse id="orbit-path" cx="1665" cy="362" rx="228" ry="58" transform="rotate(-8 1665 362)" fill="none" stroke="#0b0a12" stroke-width="1.5" stroke-dasharray="1000" stroke-dashoffset="1000" />
        </svg>
        <div id="name" class="heavy"><span>Y</span><span>O</span><span>U</span><span>S</span><span>E</span><span>F</span></div>
        <div id="from-mask"><span id="from" class="serif">from RezFl</span></div>
        <div id="o-ring"></div>
        <div class="ticks" id="tk1"></div>
      </div>

      <!-- 02 / BOOKED (2.2 to 7.2s): dot → glowing pill → notification → dot → purple flood -->
      <div id="ch2" class="clip" data-start="2.2" data-duration="5.0" style="z-index:20">
        <div id="shape">
          <div id="notif">
            <div class="ic"><b style="height:12px"></b><b style="height:24px"></b><b style="height:18px"></b><b style="height:9px"></b></div>
            <div class="tx">
              <div class="l1">RezFlo <span>now</span></div>
              <div class="l2">Call booked · intro call with Yousef</div>
            </div>
          </div>
        </div>
        <div id="confirm"><svg viewBox="0 0 24 24" fill="none" stroke="#0b0a12" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>CONFIRMED</div>
      </div>

      <!-- 03 / OVERVIEW (7.08 to 7.82s): purple frame, outlined word wallpaper -->
      <div id="cut-ov" class="clip cut" data-start="7.08" data-duration="0.74">
        <div class="wall" id="wall-ov"></div>
        <div class="fg">
          <div class="heavy" id="ov-word">Overview<span class="pdot"></span></div>
          <div class="mask"><span class="serif" id="ov-sub">in three parts</span></div>
        </div>
      </div>

      <!-- 03 / what · how · why (7.82 to 12.6s) -->
      <div id="ch3" class="clip" data-start="7.82" data-duration="4.8" style="z-index:10">
        <div id="dots"></div>
        <div class="row3" id="r-what" style="top:300px"><span class="n mono">01</span><span class="wwrap"><span class="w heavy">What<span class="pdot"></span></span><span class="ul"></span></span></div>
        <div class="row3" id="r-how" style="top:418px"><span class="n mono">02</span><span class="wwrap"><span class="w heavy">How<span class="pdot"></span></span><span class="ul"></span></span></div>
        <div class="row3" id="r-why" style="top:536px"><span class="n mono">03</span><span class="wwrap"><span class="w heavy">Why<span class="pdot"></span></span><span class="ul"></span></span></div>
        <div id="speak-mask"><span id="speak" class="serif">before we speak.</span></div>
      </div>

      <!-- 04 / THE PROBLEM: one hard cut per word -->
      <div id="cut-same" class="clip cut" data-start="13.82" data-duration="0.68">
        <div class="wall" id="wall-same"></div>
        <div class="fg">
          <div class="heavy" id="same-a">Same</div>
          <div class="heavy" id="same-b">Problem<span class="pdot"></span></div>
        </div>
      </div>
      <div id="cut-every" class="clip cut" data-start="14.5" data-duration="0.36">
        <div class="heavy big" id="w-every">Every<span class="pdot"></span></div>
      </div>
      <div id="cut-single" class="clip cut" data-start="14.86" data-duration="0.38">
        <div class="heavy big" id="w-single">Single<span class="pdot"></span></div>
      </div>
      <div id="cut-day" class="clip cut" data-start="15.24" data-duration="0.76">
        <div class="heavy big" id="w-day">Day<span class="pdot" id="day-dot"><span class="ticks" id="tk2"></span><span id="orbiters"></span><svg viewBox="0 0 24 24" fill="#fff"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span></div>
      </div>

      <!-- HUD frame -->
      <div id="hud" class="on-footage">
        <div class="br hud-in" id="br-tl"></div>
        <div class="br hud-in" id="br-tr"></div>
        <div class="br hud-in" id="br-bl"></div>
        <div class="br hud-in" id="br-br"></div>
        <div class="hl mono hud-in" id="hl-tl">RezFlo / Pre-call '26</div>
        <div class="hl mono hud-in" id="hl-tr"><span id="rec"></span><span>TC <span id="tc">00:00:00:00</span></span></div>
        <div class="hl mono hud-in" id="hl-bl"><span id="c1">01 / 04<em>Hello</em></span><span id="c2">02 / 04<em>Booked</em></span><span id="c3">03 / 04<em>Overview</em></span><span id="c4">04 / 04<em>The problem</em></span></div>
        <div class="hl mono hud-in" id="hl-br"><span>Bar <span id="bar">01</span>/08</span><span id="beats"><i></i><i></i><i></i><i></i></span></div>
        <div class="hud-in" id="prog-track"></div>
        <div class="hud-in" id="prog"></div>
      </div>

      <!-- SOUND (quiet, under his voice) -->
      <audio id="sfx-1" src="sfx/tick.wav" data-start="0.6" data-duration="0.09" data-volume="0.35"></audio>
      <audio id="sfx-2" src="sfx/star.wav" data-start="1.16" data-duration="0.07" data-volume="0.4"></audio>
      <audio id="sfx-3" src="sfx/pop.wav" data-start="2.28" data-duration="0.17" data-volume="0.45"></audio>
      <audio id="sfx-4" src="sfx/fill.wav" data-start="2.36" data-duration="0.5" data-volume="0.18" data-fade-out="0.3"></audio>
      <audio id="sfx-5" src="sfx/switch.wav" data-start="4.18" data-duration="0.14" data-volume="0.4"></audio>
      <audio id="sfx-6" src="sfx/success.wav" data-start="4.62" data-duration="0.75" data-volume="0.3"></audio>
      <audio id="sfx-7" src="sfx/chime.wav" data-start="5.04" data-duration="0.95" data-volume="0.3"></audio>
      <audio id="sfx-8" src="sfx/snap.wav" data-start="7.08" data-duration="0.16" data-volume="0.45"></audio>
      <audio id="sfx-9" src="sfx/tick.wav" data-start="7.84" data-duration="0.09" data-volume="0.4"></audio>
      <audio id="sfx-10" src="sfx/tick.wav" data-start="9.34" data-duration="0.09" data-volume="0.4"></audio>
      <audio id="sfx-11" src="sfx/tick.wav" data-start="10.28" data-duration="0.09" data-volume="0.4"></audio>
      <audio id="sfx-12" src="sfx/snap.wav" data-start="13.82" data-duration="0.16" data-volume="0.45"></audio>
      <audio id="sfx-13" src="sfx/tick.wav" data-start="14.04" data-duration="0.09" data-volume="0.4"></audio>
      <audio id="sfx-14" src="sfx/snap.wav" data-start="14.5" data-duration="0.16" data-volume="0.45"></audio>
      <audio id="sfx-15" src="sfx/snap.wav" data-start="14.86" data-duration="0.16" data-volume="0.45"></audio>
      <audio id="sfx-16" src="sfx/snap.wav" data-start="15.24" data-duration="0.16" data-volume="0.45"></audio>
      <audio id="sfx-17" src="sfx/pop.wav" data-start="15.5" data-duration="0.17" data-volume="0.45"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const spring = "back.out(1.3)";

      // --- builders (deterministic) ---
      // gap: skip ticks between these angles (0° = up) so a ring can open toward nearby text
      const buildTicks = (id, n, r, gap) => {
        const el = document.getElementById(id);
        for (let k = 0; k < n; k++) {
          const a = (k / n) * 360;
          if (gap && a > gap[0] && a < gap[1]) continue;
          const t = document.createElement("i");
          t.style.transform = "rotate(" + a + "deg) translateY(" + (-r) + "px)";
          if (k % 6 === 0) t.className = "maj";
          el.appendChild(t);
        }
      };
      buildTicks("tk1", 48, 34, [200, 340]);
      buildTicks("tk2", 48, 46);
      const orb = document.getElementById("orbiters");
      for (let k = 0; k < 7; k++) {
        const d = document.createElement("i");
        d.style.opacity = String(1 - k * 0.13);
        d.style.transform = "rotate(" + (-k * 9) + "deg) translateY(-58px) scale(" + (1 - k * 0.1) + ")";
        orb.appendChild(d);
      }
      const fillWall = (id, word, rows) => {
        const el = document.getElementById(id);
        for (let r = 0; r < rows; r++) {
          const d = document.createElement("div");
          d.textContent = (word + " — ").repeat(8);
          d.style.marginLeft = (r % 2 ? -260 : 0) + "px";
          el.appendChild(d);
        }
      };
      fillWall("wall-ov", "Overview", 14);
      fillWall("wall-same", "Same problem", 14);
      const dotsEl = document.getElementById("dots");
      for (let r = 0; r < 12; r++) for (let c = 0; c < 12; c++) {
        const d = document.createElement("i");
        d.style.left = (c * 35 + 15) + "px"; d.style.top = (r * 35 + 15) + "px";
        dotsEl.appendChild(d);
      }

      // --- HUD: timecode, beat counter (120 BPM), progress, REC blink ---
      const tcEl = document.getElementById("tc"), barEl = document.getElementById("bar");
      const beatEls = document.querySelectorAll("#beats i");
      const pad = (n) => String(n).padStart(2, "0");
      const clock = { v: 0 };
      tl.fromTo(clock, { v: 0 }, { v: 16, duration: 16, ease: "none", onUpdate: () => {
        const f = Math.floor(clock.v * 30 + 1e-6);
        tcEl.textContent = "00:00:" + pad(Math.floor(f / 30)) + ":" + pad(f % 30);
        const beat = Math.floor(clock.v * 2 + 1e-6);
        barEl.textContent = pad(Math.min(8, Math.floor(beat / 4) + 1));
        beatEls.forEach((b, k) => { b.style.background = (k === beat % 4) ? "currentColor" : "transparent"; });
      } }, 0);
      tl.fromTo("#prog", { scaleX: 0 }, { scaleX: 1, duration: 16, ease: "none" }, 0);
      tl.fromTo("#rec", { opacity: 1 }, { opacity: 0.15, duration: 0.5, ease: "steps(1)", repeat: 31, yoyo: true }, 0);
      tl.fromTo(".br", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", stagger: 0.03 }, 0.6);
      tl.fromTo("#hl-tl, #hl-tr, #hl-bl, #hl-br, #prog-track, #prog", { opacity: 0 }, { opacity: 1, duration: 0.25, stagger: 0.04 }, 0.68);
      tl.set("#c1", { opacity: 1 }, 0.6);
      tl.set("#c1", { opacity: 0 }, 4.18); tl.set("#c2", { opacity: 1 }, 4.18);
      tl.set("#c2", { opacity: 0 }, 7.08); tl.set("#c3", { opacity: 1 }, 7.08);
      tl.set("#c3", { opacity: 0 }, 12.84); tl.set("#c4", { opacity: 1 }, 12.84);
      tl.set("#hud", { className: "on-dark" }, 7.08);
      tl.set("#hud", { className: "on-footage" }, 7.82);
      tl.set("#hud", { className: "on-dark" }, 13.82);
      tl.set("#hud", { className: "on-light" }, 14.5);
      tl.set("#hud", { className: "on-dark" }, 14.86);

      // --- 01 / HELLO — "Yousef" 1.16, "from RezFlo" 1.5 ---
      tl.fromTo("#orbit-path", { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.7, ease: "power2.inOut" }, 1.0);
      const rot = [-80, 60, -45, 90, -60, 45];
      tl.fromTo("#name span", { y: -80, x: (i) => (i - 2.5) * 46, rotation: (i) => rot[i], opacity: 0 },
        { y: 0, x: 0, rotation: 0, opacity: 1, duration: 0.5, ease: spring, stagger: 0.05 }, 1.16);
      tl.fromTo("#from", { yPercent: 140 }, { yPercent: 0, duration: 0.45, ease: "power4.out" }, 1.5);
      tl.fromTo("#o-ring", { scale: 0 }, { scale: 1, duration: 0.3, ease: spring }, 1.6);
      // the "o" becomes the dot (2.28), a tick ring wipes on around it and spins
      tl.to("#o-ring", { scale: 0.4, opacity: 0, duration: 0.14, ease: "power2.in" }, 2.28);
      tl.set("#shape", { x: 1771.5, y: 451.5 }, 0);
      tl.fromTo("#shape", { scale: 0 }, { scale: 1, duration: 0.3, ease: spring }, 2.3);
      tl.fromTo("#tk1 i", { opacity: 0 }, { opacity: (i) => (i % 6 === 0 ? 1 : 0.5), duration: 0.05, stagger: 0.008 }, 2.36);
      tl.fromTo("#tk1", { rotation: -10 }, { rotation: 10, duration: 1.5, ease: "sine.inOut" }, 2.36);
      tl.fromTo("#shape", { scale: 1 }, { scale: 1.25, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 2.66);
      // lockup leaves, ticks retract, dot stays
      tl.to("#name span", { y: 40, opacity: 0, duration: 0.28, ease: "power2.in", stagger: 0.025 }, 3.7);
      tl.to("#orbit-path", { attr: { "stroke-dashoffset": -1000 }, duration: 0.45, ease: "power2.in" }, 3.66);
      tl.to("#from", { yPercent: -140, duration: 0.3, ease: "power3.in" }, 3.72);
      tl.to("#tk1 i", { opacity: 0, duration: 0.04, stagger: { each: 0.005, from: "end" } }, 3.86);

      // --- 02 / BOOKED — "you've" 4.18 → glowing pill, "booked" 4.66 → notification, "call" 5.04 → confirmed ---
      tl.to("#shape", { x: 1555, y: 404, width: 220, height: 22, borderRadius: 11, backgroundColor: "#8f7bff",
        boxShadow: "0 0 46px 10px rgba(143,123,255,0.85)", duration: 0.24, ease: "power4.out" }, 4.18);
      tl.to("#shape", { x: 1455, y: 367, width: 420, height: 96, borderRadius: 26, backgroundColor: "#0b0a12",
        boxShadow: "0 22px 60px 0px rgba(63,43,166,0.45)", duration: 0.34, ease: "power3.inOut" }, 4.42);
      tl.fromTo("#notif", { opacity: 0, filter: "blur(10px)", y: 8 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.28, ease: "power2.out" }, 4.62);
      tl.fromTo("#confirm", { opacity: 0, y: -26, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.32, ease: spring }, 5.04);
      tl.to("#shape", { y: 361, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.2);
      // collapse to a dot (6.5), flood into the purple OVERVIEW frame (7.08)
      tl.to("#notif, #confirm", { opacity: 0, duration: 0.15 }, 6.42);
      tl.to("#shape", { x: 1652, y: 402, width: 26, height: 26, borderRadius: 13, backgroundColor: "#5b41da",
        boxShadow: "0 0 0px 0px rgba(63,43,166,0)", duration: 0.32, ease: "power3.inOut" }, 6.5);
      tl.to("#shape", { x: -135, y: -1385, width: 3600, height: 3600, borderRadius: 1800, duration: 0.26, ease: "power3.in" }, 6.84);

      // --- 03 / OVERVIEW — slam with skew on "overview" (7.1), wallpaper drifts ---
      tl.fromTo("#wall-ov div", { x: (i) => (i % 2 ? -160 : 0) }, { x: (i) => (i % 2 ? 0 : -160), duration: 0.74, ease: "none" }, 7.08);
      tl.fromTo("#ov-word", { scale: 1.3, skewX: -14, opacity: 0 }, { scale: 1, skewX: 0, opacity: 1, duration: 0.2, ease: "expo.out" }, 7.08);
      tl.fromTo("#ov-sub", { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: "power4.out" }, 7.28);

      // --- 03 / what · how · why — words fly in from the right, active one turns purple with an underline ---
      tl.fromTo("#vid-wrap", { scale: 1 }, { scale: 1.05, duration: 4.8, ease: "sine.inOut" }, 7.82);
      tl.set("#vid-wrap", { scale: 1 }, 13.82);
      tl.fromTo("#dots i", { opacity: 0, scale: 0 }, { opacity: 0.55, scale: 1, duration: 0.3, stagger: { grid: [12, 12], from: "start", amount: 0.5 } }, 7.84);
      tl.fromTo("#dots i", { scale: 1 }, { scale: 2, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false, stagger: { grid: [12, 12], from: "start", amount: 1.1 } }, 8.3);
      tl.set(".row3 .ul", { scaleX: 0 }, 0);
      const land = (row, t) => {
        tl.fromTo(row + " .w", { x: 340, opacity: 0, skewX: -10 }, { x: 0, opacity: 1, skewX: 0, duration: 0.34, ease: "expo.out" }, t);
        tl.fromTo(row + " .n", { opacity: 0 }, { opacity: 1, duration: 0.2 }, t + 0.1);
        tl.to(row + " .w", { color: "#3f2ba6", duration: 0.15 }, t + 0.12);
        tl.fromTo(row + " .ul", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, t + 0.14);
      };
      const rest = (row, t) => {
        tl.to(row + " .w", { color: "#0b0a12", opacity: 0.28, duration: 0.25 }, t);
        tl.to(row + " .ul", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.25, ease: "power2.in" }, t);
      };
      land("#r-what", 7.84);
      rest("#r-what", 9.34); land("#r-how", 9.34);
      rest("#r-how", 10.28); land("#r-why", 10.28);
      // "before we speak" (10.94): all three back to full, underline off
      tl.to("#r-what .w, #r-how .w", { opacity: 1, duration: 0.3 }, 10.94);
      tl.to("#r-why .w", { color: "#0b0a12", duration: 0.3 }, 10.94);
      tl.to("#r-why .ul", { scaleX: 0, transformOrigin: "100% 50%", duration: 0.25, ease: "power2.in" }, 10.94);
      tl.fromTo("#speak", { yPercent: 140 }, { yPercent: 0, duration: 0.4, ease: "power4.out" }, 10.94);
      tl.to(".row3 .w", { x: -60, opacity: 0, duration: 0.26, ease: "power3.in", stagger: 0.05 }, 12.25);
      tl.to(".row3 .n", { opacity: 0, duration: 0.2 }, 12.25);
      tl.to("#speak", { yPercent: -140, duration: 0.28, ease: "power3.in" }, 12.35);
      tl.to("#dots i", { scale: 0, opacity: 0, duration: 0.25, stagger: { grid: [12, 12], from: "end", amount: 0.3 } }, 12.2);

      // --- 04 / THE PROBLEM — "same" 13.82, "problem" 14.04, "every" 14.5, "single" 14.86, "day" 15.24 ---
      tl.fromTo("#wall-same div", { x: (i) => (i % 2 ? -200 : 0) }, { x: (i) => (i % 2 ? 0 : -200), duration: 0.68, ease: "none" }, 13.82);
      const slam = (sel, t, from) => tl.fromTo(sel, from, { scale: 1, skewX: 0, x: 0, opacity: 1, duration: 0.18, ease: "expo.out" }, t);
      slam("#same-a", 13.82, { scale: 1.25, skewX: -12, opacity: 0 });
      slam("#same-b", 14.04, { scale: 1.25, skewX: -12, opacity: 0 });
      slam("#w-every", 14.5, { x: 260, skewX: -16, scale: 1.05 });
      slam("#w-single", 14.86, { x: -260, skewX: 16, scale: 1.05 });
      slam("#w-day", 15.24, { scale: 1.2, skewX: -12 });
      // DAY's full stop becomes a red ringing phone with a tick ring and an orbiting trail (15.5)
      tl.to("#day-dot", { scale: 2.6, backgroundColor: "#ff5a5f", duration: 0.26, ease: spring }, 15.5);
      tl.to("#w-day", { x: -80, duration: 0.26, ease: spring }, 15.5);
      tl.fromTo("#day-dot svg", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 15.6);
      tl.fromTo("#tk2 i", { opacity: 0 }, { opacity: (i) => (i % 6 === 0 ? 1 : 0.55), duration: 0.03, stagger: 0.004 }, 15.6);
      tl.fromTo("#tk2", { rotation: 0 }, { rotation: 40, duration: 0.4, ease: "none" }, 15.6);
      tl.fromTo("#orbiters", { rotation: -60, opacity: 0 }, { rotation: 260, opacity: 1, duration: 0.4, ease: "power1.inOut" }, 15.6);
      [15.66, 15.88].forEach((t) => {
        tl.to("#day-dot", { x: -5, duration: 0.04 }, t);
        tl.to("#day-dot", { x: 5, duration: 0.04 }, t + 0.04);
        tl.to("#day-dot", { x: -3, duration: 0.04 }, t + 0.08);
        tl.to("#day-dot", { x: 0, duration: 0.04 }, t + 0.12);
      });

      window.__timelines["main"] = tl;
    </script>
