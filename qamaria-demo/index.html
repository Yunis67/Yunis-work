<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RezFlo · Qamaria Yemeni Coffee Co.</title>
<!--
  RezFlo partner dashboard for Qamaria (Edmonton + Mississauga).
  Everything here runs in the browser from this one file. Calls, callers, orders and minutes are generated
  sample data (seeded, so they're the same on every load). There is no backend, no real login and no live agent.
-->
<style>
  /* Brand colours live here so the dashboard can be white-labelled by swapping these values. */
  :root {
    --accent: #5B41DA;          /* RezFlo purple */
    --accent-2: #8F7BFF;        /* accent for text and lines on dark */
    --accent-soft: rgba(91, 65, 218, 0.16);
    --loc2: #ff9a76;            /* second location's line on comparison charts */
    --bg: #0f0e17;
    --panel: #17151f;
    --panel-2: #1e1b29;
    --line: #2a2738;
    --text: #f1eff8;
    --muted: #9b97ae;
    --faint: #6d6982;
    --ok: #34c759;              /* answered / done */
    --warn: #ffb547;
    --bad: #ff5a5f;             /* missed / hung up */
    --info: #4da3ff;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent-2); }

  /* sign in + picker */
  .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(900px 500px at 50% -10%, rgba(91,65,218,.22), transparent 70%), var(--bg); }
  .gate-card { width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 32px 28px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .gate-card .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; margin-bottom: 24px; }
  .gate-card h1 { font-size: 23px; margin-bottom: 6px; letter-spacing: -0.01em; }
  .gate-card > p { color: var(--muted); margin-bottom: 22px; }
  .gate-card .field input { padding: 12px 14px; }
  .gate-row { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .gate-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .gate-row input { accent-color: var(--accent); }
  .linkbtn { background: none; border: 0; color: var(--accent-2); font-size: 13px; padding: 0; }
  .btn.wide { width: 100%; padding: 12px 16px; margin-top: 16px; font-size: 15px; }
  .gate-foot { color: var(--faint); font-size: 12.5px; margin-top: 18px; text-align: center; }
  .acct { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; transition: border-color .15s, transform .15s; }
  .acct:hover { border-color: var(--accent-2); transform: translateY(-1px); }
  .acct .av { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent-2); flex: none; }
  .acct .av svg { width: 20px; height: 20px; }
  .acct b { display: block; color: var(--text); font-size: 14.5px; }
  .acct span { color: var(--muted); font-size: 13px; }
  .acct .cnt { margin-left: auto; text-align: right; white-space: nowrap; }
  .acct .cnt b { font-size: 16px; }
  .acct .cnt + .go { margin-left: 4px; }
  .acct .go { margin-left: auto; color: var(--faint); font-size: 18px; }

  /* app shell: sidebar + content */
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); padding: 18px 12px 12px; }
  .side .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; padding: 2px 8px 16px; }
  .scope { margin: 0 4px 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
  .scope b { display: block; font-size: 13.5px; }
  .scope span { color: var(--muted); font-size: 12px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 11px; width: 100%; background: none; border: 0; border-radius: 10px; padding: 9px 12px; color: var(--muted); font-weight: 600; text-align: left; }
  .nav button svg { width: 18px; height: 18px; flex: none; }
  .nav button:hover { background: var(--panel-2); color: var(--text); }
  .nav button.on { background: var(--accent-soft); color: var(--text); }
  .nav button.on svg { color: var(--accent-2); }
  .status { margin: auto 4px 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(52,199,89,.25); background: rgba(52,199,89,.07); font-size: 12.5px; }
  .status b { display: flex; align-items: center; gap: 8px; color: #7be39a; }
  .status span { color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(52,199,89,.18); flex: none; }
  .acctwrap { position: relative; }
  .acctbtn { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line); border-radius: 12px; padding: 9px 10px; text-align: left; }
  .acctbtn:hover, .acctbtn.on { background: var(--panel-2); }
  .acctbtn .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent); color: #fff; flex: none; }
  .acctbtn .who { min-width: 0; flex: 1; }
  .acctbtn .who b { display: block; font-size: 13px; }
  .acctbtn .who span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acctbtn .chev { color: var(--faint); }
  .menu { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.45); z-index: 30; }
  .menu[hidden] { display: none; }
  .menu .mh { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .menu .mh b { display: block; font-size: 13px; }
  .menu .mh span { color: var(--muted); font-size: 12px; word-break: break-all; }
  .menu .ml { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); padding: 6px 10px 4px; }
  .menu button { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-radius: 9px; padding: 8px 10px; text-align: left; font-size: 13px; }
  .menu button:hover { background: var(--panel-2); }
  .menu button .ck { margin-left: auto; color: var(--accent-2); }
  .menu button small { display: block; color: var(--muted); font-size: 11.5px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  .content { min-width: 0; }
  .top { display: flex; align-items: center; gap: 14px; padding: 14px 26px; border-bottom: 1px solid var(--line); background: rgba(15,14,23,.85); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 20; flex-wrap: wrap; }
  .top h1 { font-size: 17px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; color: var(--muted); }
  .top .spacer { flex: 1; }
  .clock { color: var(--muted); font-size: 13px; font-family: var(--mono); }

  main { padding: 20px 26px 44px; max-width: 1360px; }
  .h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .h h2 { font-size: 22px; letter-spacing: -0.01em; }
  .h p { color: var(--muted); font-size: 13px; }
  .h .ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  .grid { display: grid; gap: 14px; }
  .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
  .card h3 { font-size: 15px; margin-bottom: 2px; }
  .card .sub { color: var(--muted); font-size: 12.5px; }
  .kpi .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; font-family: var(--mono); }
  .kpi .val { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
  .toastval { display: inline-flex; align-items: center; gap: 10px; }
  .toastlogo { width: 30px; height: 30px; flex: none; }
  .kpi .delta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  .two { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
  .halves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }

  .usage .barwrap { height: 12px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 12px 0 8px; border: 1px solid var(--line); }
  .usage .bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 999px; }
  .usage .row { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; gap: 10px; flex-wrap: wrap; }
  .usage .big { font-size: 24px; font-weight: 700; }
  .usage .big small { font-size: 14px; color: var(--muted); font-weight: 500; }
  .minibar { display: flex; align-items: center; gap: 10px; }
  .minibar .tr { width: 96px; height: 7px; background: var(--panel-2); border-radius: 999px; overflow: hidden; flex: none; }
  .minibar .tr i { display: block; height: 100%; border-radius: 999px; }

  .chart { width: 100%; display: block; margin-top: 10px; }
  .chart text { fill: var(--muted); font-size: 12px; font-family: var(--font); }
  .chartbox { position: relative; cursor: crosshair; }
  .chartbox .guide { position: absolute; width: 1px; background: var(--muted); opacity: .5; pointer-events: none; }
  .chartbox .hdot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--panel); border: 3px solid; pointer-events: none; }
  .chartbox .ctip { position: absolute; z-index: 5; min-width: 170px; background: #0b0a12; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; pointer-events: none; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .chartbox .ctip b { display: block; margin-bottom: 6px; font-size: 12.5px; }
  .chartbox .ctip div { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); }
  .chartbox .ctip div i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .chartbox .ctip div span { margin-left: auto; padding-left: 14px; color: var(--text); font-weight: 700; font-family: var(--mono); font-size: 13px; }
  .chartbox.hide-0 .ser.s0, .chartbox.hide-1 .ser.s1, .chartbox.hide-2 .ser.s2 { display: none; }
  .chartbox.hide-0 .lg[data-series="0"], .chartbox.hide-1 .lg[data-series="1"], .chartbox.hide-2 .lg[data-series="2"] { opacity: .4; text-decoration: line-through; }
  .legend { display: flex; gap: 6px; color: var(--muted); font-size: 12.5px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .legend .lg { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; color: var(--text); font-size: 12.5px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
  .legend .hint { margin-left: auto; color: var(--faint); font-size: 12px; }

  .resolve .item { margin-top: 12px; }
  .resolve .item .t { display: flex; justify-content: space-between; font-size: 13px; }
  .resolve .item .t span { color: var(--muted); }
  .resolve .track { height: 8px; background: var(--panel-2); border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .resolve .fill { height: 100%; border-radius: 999px; }

  .reasons .r { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .reasons .r:last-child { border-bottom: 0; }
  .reasons .r .n { margin-left: auto; color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .reasons .r .mini { width: 90px; height: 6px; background: var(--panel-2); border-radius: 999px; overflow: hidden; flex: none; }
  .reasons .r .mini i { display: block; height: 100%; background: var(--accent-2); border-radius: 999px; }

  /* tables */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--mono); }
  td { padding: 11px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td.wrap { white-space: normal; min-width: 200px; }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: var(--panel-2); }
  td .who2 b { display: block; font-weight: 600; }
  td .who2 span { color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .locdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .c-order { color: #b7a9ff; background: rgba(143,123,255,.14); }
  .c-answer { color: #7cc0ff; background: rgba(77,163,255,.13); }
  .c-ref { color: #ffcf7d; background: rgba(255,181,71,.13); }
  .c-msg { color: #ffa98a; background: rgba(255,154,118,.13); }
  .c-miss { color: #ff8a8e; background: rgba(255,90,95,.13); }
  .c-live { color: #7be39a; background: rgba(52,199,89,.13); }
  .c-setup { color: #ffcf7d; background: rgba(255,181,71,.13); }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .search { flex: 1; min-width: 200px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
  select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; }
  select.msel { padding: 8px 34px 8px 12px; font-weight: 600; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
  .pager { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12.5px; padding-top: 12px; }
  .pager button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 5px 12px; }
  .pager button:disabled { opacity: .35; cursor: default; }

  /* order ticket rail */
  .rail { display: flex; flex-direction: column; gap: 12px; max-height: 1040px; overflow-y: auto; padding-right: 2px; }
  .ticket { background: #f6f3ea; color: #1b1a22; border-radius: 12px; padding: 14px 16px 12px; position: relative; cursor: pointer; font-size: 13px; transition: transform .12s; }
  .ticket:hover { transform: translateY(-2px); }
  .ticket::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 12px; background: radial-gradient(circle at 6px -2px, transparent 6px, #f6f3ea 6.5px) 0 0 / 12px 12px repeat-x; }
  .ticket .tk-h { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; color: #5c5870; text-transform: uppercase; letter-spacing: .06em; }
  .ticket .tk-n { font-weight: 700; font-size: 15px; margin: 6px 0 8px; }
  .ticket .tk-i { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .ticket .tk-i small { display: block; color: #6b6780; font-size: 11.5px; }
  .ticket .tk-t { display: flex; justify-content: space-between; border-top: 1px dashed #c9c3b4; margin-top: 8px; padding-top: 8px; font-weight: 700; }
  .ticket .tk-s { margin-top: 6px; font-size: 11.5px; color: #6b6780; }

  /* location cards */
  .loccard .lh { display: flex; align-items: center; gap: 12px; }
  .loccard .lav { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; flex: none; }
  .loccard .facts { margin-top: 14px; }
  .loccard .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .loccard .stats div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .loccard .stats b { display: block; font-size: 18px; }
  .loccard .stats span { color: var(--faint); font-size: 11.5px; }

  /* call drawer */
  .scrim { position: fixed; inset: 0; background: rgba(5,4,10,.55); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 50; transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; }
  .drawer.on { transform: none; }
  .drawer .dh { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .drawer .dh h3 { font-size: 18px; }
  .drawer .dh .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .drawer .x { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; width: 34px; height: 34px; font-size: 18px; flex: none; }
  .drawer .db { padding: 16px 20px 30px; overflow-y: auto; }
  .sect { margin-top: 18px; }
  .sect > .lab { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--faint); margin-bottom: 8px; }
  .player { background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
  .player .pb { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); border: 0; color: #fff; display: grid; place-items: center; flex: none; }
  .player .wave { flex: 1; height: 36px; display: flex; align-items: center; gap: 2px; }
  .player .wave i { flex: 1; background: var(--line); border-radius: 2px; }
  .player .wave i.p { background: var(--accent-2); }
  .player .tm { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 86px; text-align: right; }
  .summary { background: var(--accent-soft); border: 1px solid rgba(143,123,255,.3); border-radius: 12px; padding: 12px 14px; }
  .tx { display: flex; flex-direction: column; gap: 10px; }
  .tx .ln { display: flex; gap: 10px; padding: 6px 8px; border-radius: 10px; transition: background .2s; }
  .tx .ln.hl { background: var(--panel-2); }
  .tx .sp { flex: none; width: 54px; font-size: 12px; font-weight: 700; padding-top: 1px; }
  .tx .sp.ai { color: var(--accent-2); }
  .tx .sp.cu { color: var(--muted); }
  .tx .ts { flex: none; font-family: var(--mono); font-size: 11px; color: var(--faint); width: 36px; padding-top: 2px; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .facts div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .facts span { display: block; color: var(--faint); font-size: 11.5px; }

  /* buttons, modal, toast */
  .btn { background: var(--accent); border: 0; color: #fff; border-radius: 12px; padding: 9px 16px; font-weight: 600; }
  .btn:disabled { opacity: .7; cursor: default; }
  .btn.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }
  .modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 60; padding: 16px; background: rgba(5,4,10,.6); }
  .modal[hidden] { display: none; }
  .modal .box { width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px; }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .field { margin-top: 12px; }
  .field label { display: block; color: var(--muted); font-size: 12.5px; margin-bottom: 5px; }
  .field input, .field select { width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .field input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent-2); }
  .pkgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pkg { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .pkg b { display: block; }
  .pkg span { color: var(--muted); font-size: 12px; }
  .pkg.on { border-color: var(--accent-2); box-shadow: 0 0 0 2px var(--accent-soft); }
  .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* ---------------- seeded random (same numbers on every load) ---------------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rngKit(seed) {
  const rnd = mulberry32(seed);
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const between = (a, b) => a + rnd() * (b - a);
  const weighted = (pairs) => { const tot = pairs.reduce((s, p) => s + p[1], 0); let r = rnd() * tot; for (const [v, w] of pairs) { if ((r -= w) <= 0) return v; } return pairs[pairs.length - 1][0]; };
  const poisson = (lambda) => { const L = Math.exp(-lambda); let k = 0, p = 1; do { k++; p *= rnd(); } while (p > L); return k - 1; };
  return { rnd, pick, between, weighted, poisson };
}

/* ---------------- shared helpers ---------------- */
const NOW = Date.parse(DEMO_NOW);
const HOUR = 3600e3, MIN = 60e3, DAY = 24 * HOUR;
const money = new Intl.NumberFormat(CONFIG.locale, { style: 'currency', currency: CONFIG.currency });
const num = new Intl.NumberFormat(CONFIG.locale);
const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);
const durFmt = (s) => `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, '0')}s`;
const clockFmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const hourLabel = (h) => { const x = h % 24; return `${x % 12 === 0 ? 12 : x % 12}:00 ${x < 12 ? 'a.m.' : 'p.m.'}`; };   // en-CA style, matches Intl times
const pctOf = (a, b) => (b ? Math.round(a / b * 100) : 0);

const FIRST = ['Amira','Omar','Layla','Yusuf','Noor','Hana','Zaid','Sara','Ali','Maya','Liam','Emma','Noah','Olivia','Ethan','Jordan','Priya','Arjun','Mei','Daniel','Fatima','Khalid','Rania','Tariq','Chloe','Lucas','Sophia','Malik','Iman','Hassan','Leila','Adam','Mariam','Samir','Grace','Owen','Aisha','Ryan','Nadia','Karim','Jasmine','Ben','Dina','Marcus','Huda','Isaac','Salma','Tyler','Reem','Kevin'];

/* call types (shared by both locations) */
const PH = CONFIG.takesPhoneOrders;
const TYPES = {
  order:    { reason: 'Pickup order',        outcome: 'Order taken',        chip: 'c-order',  w: PH ? 33 : 0, dur: [70, 190] },
  hours:    { reason: 'Hours',               outcome: 'Question answered',  chip: 'c-answer', w: 15, dur: [25, 55] },
  location: { reason: 'Location & parking',  outcome: 'Question answered',  chip: 'c-answer', w: 12, dur: [30, 70] },
  menu:     { reason: 'Menu question',       outcome: 'Question answered',  chip: 'c-answer', w: PH ? 12 : 30, dur: [35, 90] },
  reserve:  { reason: 'Reservation request', outcome: 'Question answered',  chip: 'c-answer', w: 6, dur: [30, 60] },
  catering: { reason: 'Catering',            outcome: 'Referred to email',  chip: 'c-ref',    w: 5, dur: [40, 80] },
  online:   { reason: 'Online ordering',     outcome: 'Question answered',  chip: 'c-answer', w: 4, dur: [30, 60] },
  staff:    { reason: 'Message for staff',   outcome: 'Message for staff',  chip: 'c-msg',    w: 6, dur: [45, 100] },
  hangup:   { reason: 'Hung up',             outcome: 'Hung up',            chip: 'c-miss',   w: 5, dur: [3, 12] },
};
const typeWeights = Object.entries(TYPES).filter(([, t]) => t.w > 0).map(([k, t]) => [k, t.w]);
const isOrder = (c) => c.type === 'order';
const handled = (c) => c.type !== 'hangup';
/* hour-of-day weights (café rhythm: morning coffee, lunch, evening hangout) */
const HOUR_W = { 7: 0.9, 8: 1.3, 9: 1.5, 10: 1.1, 11: 1.0, 12: 1.2, 13: 1.0, 14: 0.8, 15: 0.8, 16: 0.9, 17: 1.0, 18: 1.2, 19: 1.4, 20: 1.4, 21: 1.2, 22: 0.9, 23: 0.6, 24: 0.4 };

/* =====================================================================
   Build one location: its clock, its calls since April, orders and minutes.
   ===================================================================== */
function buildLocation(cfg, seedOffset) {
  const K = rngKit(CONFIG.seed + seedOffset);
  const off = cfg.utcOffsetHours;
  const mid = (y, m, d) => Date.UTC(y, m, d) - off * HOUR;          // local midnight as epoch ms
  const wall = new Date(NOW + off * HOUR);                           // read with getUTC* = local wall clock
  const Y = wall.getUTCFullYear(), M = wall.getUTCMonth(), TODAY = wall.getUTCDate();
  const todayStart = mid(Y, M, TODAY);
  const tz = { timeZone: cfg.timeZone };
  const fTime = new Intl.DateTimeFormat(CONFIG.locale, { ...tz, hour: 'numeric', minute: '2-digit' });
  const fDay = new Intl.DateTimeFormat(CONFIG.locale, { ...tz, weekday: 'short', month: 'short', day: 'numeric' });
  const fShort = new Intl.DateTimeFormat(CONFIG.locale, { ...tz, month: 'short', day: 'numeric' });
  const plan = CONFIG.plans.find((p) => p.id === cfg.plan);
  const hoursFor = (dow) => (dow === 5 || dow === 6 ? cfg.hours.friSat : cfg.hours.sunThu);

  const callers = Array.from({ length: 100 }, (_, i) => ({ phone: `(${cfg.areaCode}) 555-01${String(i).padStart(2, '0')}`, name: FIRST[(i * 7 + seedOffset) % FIRST.length] }));

  function makeOrder(ts) {
    const items = [];
    const nItems = K.weighted([[1, 45], [2, 35], [3, 15], [4, 5]]);
    const drinks = CONFIG.menu.filter((m) => !m.sweets);
    for (let i = 0; i < nItems; i++) {
      const it = i === nItems - 1 && K.rnd() < 0.25 ? K.pick(CONFIG.menu.filter((m) => m.sweets)) : (K.rnd() < 0.8 ? K.pick(drinks.filter((d) => d.best)) : K.pick(drinks));
      const qty = it.sweets ? 1 : K.weighted([[1, 75], [2, 20], [3, 5]]);
      const milk = it.milk && K.rnd() < 0.35 ? K.pick(CONFIG.milkOptions) : null;
      const extra = milk && milk !== 'skim' ? CONFIG.plantMilkExtra : 0;
      const same = items.find((x) => x.name === it.name && x.milk === milk);   // same drink twice → one line, higher qty
      if (same) same.qty += qty; else items.push({ name: it.name, qty, milk, unit: it.price + extra });
    }
    const subtotal = items.reduce((s, i) => s + i.qty * i.unit, 0);
    const tax = Math.round(subtotal * cfg.salesTaxRate * 100) / 100;
    const pickupMin = K.pick([10, 15, 15, 20, 20, 25, 30]);
    return { items, subtotal, tax, total: subtotal + tax, pickup: ts + pickupMin * MIN, pickupMin, note: K.rnd() < 0.15 ? K.pick(['Extra hot, please', 'Less ice', 'Can you write the name on the cups?', 'Picking up at the counter']) : '' };
  }

  // calls, day by day from April 1 to now
  const calls = [];
  const histStart = mid(CONFIG.historyStart.year, CONFIG.historyStart.month, 1);
  const lastCallAt = NOW - cfg.lastCallMinAgo * MIN - 24 * 1000;
  for (let start = histStart; start <= todayStart; start += DAY) {
    const d = new Date(start + off * HOUR + 12 * HOUR);              // local noon of this day
    const mIx = d.getUTCMonth(), dow = d.getUTCDay();
    const [open, close] = hoursFor(dow);
    const dayBoost = dow === 5 || dow === 6 ? 1.35 : dow === 0 ? 1.15 : 1;
    for (let h = open; h < close; h++) {
      const n = K.poisson(1.1 * cfg.rate[mIx] * dayBoost * (start === todayStart ? cfg.todayBoost : 1) * (HOUR_W[h] || 0.4));
      for (let k = 0; k < n; k++) {
        const ts = start + h * HOUR + Math.floor(K.rnd() * 60) * MIN + Math.floor(K.rnd() * 60) * 1000;
        if (ts >= lastCallAt) continue;                              // nothing after the latest call below
        calls.push({ ts, type: K.weighted(typeWeights) });
      }
    }
    // a few after-hours hang-ups (2:00 to 6:00 AM)
    if (K.rnd() < 0.22) calls.push({ ts: start + (2 + Math.floor(K.rnd() * 4)) * HOUR + Math.floor(K.rnd() * 59) * MIN, type: 'hangup', afterHours: true });
  }
  calls.push({ ts: lastCallAt, type: PH ? 'order' : 'menu' });       // the latest call, a few minutes ago
  calls.sort((a, b) => a.ts - b.ts);

  // callers, durations, orders
  const shuffled = callers.map((c) => [K.rnd(), c]).sort((a, b) => a[0] - b[0]).map((x) => x[1]);
  let callerIx = 0, orderNo = 1001;
  for (const c of calls) {
    const t = TYPES[c.type];
    c.loc = cfg.id;
    c.caller = K.rnd() < 0.2 && callerIx > 5 ? shuffled[Math.floor(K.rnd() * Math.min(callerIx, 100))] : shuffled[callerIx++ % 100];
    c.named = c.type === 'order' || c.type === 'staff' || (c.type !== 'hangup' && K.rnd() < 0.35);
    c.dur = K.between(t.dur[0], t.dur[1]);
    if (c.type === 'order') { c.order = makeOrder(c.ts); c.order.id = `${cfg.prefix}-${orderNo++}`; c.dur += c.order.items.length * 14; }
  }
  const monthRange = (m) => [mid(Y, m, 1), m === M ? NOW : mid(Y, m + 1, 1)];
  // tune durations per month so each month's minutes land on its target share of the plan (hang-ups stay short)
  for (const m of Object.keys(cfg.usage).map(Number)) {
    const [s, e] = monthRange(m);
    const inM = calls.filter((c) => c.ts >= s && c.ts < e);
    const target = plan.minutes * cfg.usage[m] * 60;
    const fixed = sum(inM.filter((c) => c.type === 'hangup'), (c) => c.dur);
    const flex = sum(inM.filter((c) => c.type !== 'hangup'), (c) => c.dur);
    const k = (target - fixed) / flex;
    for (const c of inM) { if (c.type !== 'hangup') c.dur = Math.max(18, c.dur * k); c.dur = Math.round(c.dur); }
  }
  calls.forEach((c, i) => { c.id = `${cfg.prefix}-${String(i + 1).padStart(4, '0')}`; c.n = i + 1; });
  calls.reverse();                                                   // newest first

  const L = {
    cfg, plan, calls, Y, M, TODAY, todayStart, histStart, mid,
    fmtTime: (ts) => fTime.format(ts), fmtDay: (ts) => fDay.format(ts), fmtShortDay: (ts) => fShort.format(ts),
    dow: (ts) => new Date(ts + off * HOUR).getUTCDay(),
    monthRange,
    inRange: (s, e) => calls.filter((c) => c.ts >= s && c.ts < e),
    monthCalls: (m) => { const [s, e] = monthRange(m); return calls.filter((c) => c.ts >= s && c.ts < e); },
    minutes: (list) => Math.round(sum(list, (c) => c.dur) / 60),
  };
  L.timeLabel = (ts) => `${L.fmtTime(ts)} ${cfg.tzLabel}`;
  L.whenLabel = (ts) => (ts >= todayStart ? 'Today' : ts >= todayStart - DAY ? 'Yesterday' : L.fmtDay(ts)) + ', ' + L.timeLabel(ts);
  L.ago = (ts) => { const m = Math.round((NOW - ts) / MIN); if (m < 60) return `${m}m ago`; const h = Math.round(m / 60); if (h < 24) return `${h}h ago`; return L.fmtShortDay(ts); };
  L.today = L.inRange(todayStart, NOW + 1);
  L.yesterday = L.inRange(todayStart - DAY, todayStart);
  L.closesAt = hourLabel(hoursFor(L.dow(NOW))[1]);
  return L;
}

const LOCS = {};
CONFIG.locations.forEach((cfg, i) => { LOCS[cfg.id] = buildLocation(cfg, i * 7919); });
const LOC_IDS = Object.keys(LOCS);
const ALL = new Map();
LOC_IDS.forEach((id) => LOCS[id].calls.forEach((c) => ALL.set(c.id, c)));
const allCallsSorted = [...ALL.values()].sort((a, b) => b.ts - a.ts);

const REF = LOCS[LOC_IDS[0]];                       // month boundaries / labels (same calendar month at both)
const CUR_M = REF.M;
const MONTHS = [];
for (let m = CUR_M; m >= CONFIG.historyStart.month; m--) MONTHS.push(m);   // Oct, Sep, … Apr
const fMonth = new Intl.DateTimeFormat(CONFIG.locale, { month: 'long', year: 'numeric', timeZone: 'UTC' });
const fMonthName = new Intl.DateTimeFormat(CONFIG.locale, { month: 'long', timeZone: 'UTC' });
const fMonthShort = new Intl.DateTimeFormat(CONFIG.locale, { month: 'short', timeZone: 'UTC' });
const monthLabel = (m) => fMonth.format(Date.UTC(REF.Y, m, 15)) + (m === CUR_M ? ' (to date)' : '');
const monthName = (m) => fMonthName.format(Date.UTC(REF.Y, m, 15));
const daysIn = (m) => new Date(Date.UTC(REF.Y, m + 1, 0)).getUTCDate();

/* ---------------- transcripts (built from the real greeting / closing; no invented recipes) ---------------- */
function locationAnswer(cfg, askedParking) {
  let s = `We're at ${cfg.street} in ${cfg.area}.`;
  if (cfg.parking) s += ` There's ${cfg.parking.charAt(0).toLowerCase() + cfg.parking.slice(1)}.`;
  else if (askedParking) s += ` I don't have parking details for this location, but Google Maps will show what's close by.`;
  return s;
}
function transcript(c) {
  const cfg = LOCS[c.loc].cfg;
  const K = rngKit(CONFIG.seed ^ (c.n * 2654435761 + (c.loc === 'edm' ? 0 : 99991)));
  const AI = 'AI', CU = 'Caller', nm = c.caller.name, G = CONFIG;
  const L = [];
  const say = (who, text) => L.push({ who, text });
  say(AI, G.greeting);
  if (c.type === 'hangup') {
    say(CU, c.afterHours ? '(caller hung up; call came in after hours)' : '(caller hung up without speaking)');
    return timeLines(L, c.dur);
  }
  if (c.type === 'order') {
    const o = c.order;
    say(CU, `Hi, can I place an order for pickup?`);
    say(AI, `Of course! What can I get started for you?`);
    o.items.forEach((it, i) => {
      say(CU, `${i === 0 ? 'Can I get' : 'And'} ${it.qty === 1 ? 'a' : it.qty} ${it.name}${it.qty > 1 ? 's' : ''}${it.milk ? ` with ${it.milk} milk` : ''}${i === o.items.length - 1 ? ', please.' : '.'}`);
      say(AI, i === o.items.length - 1 ? `Got it. ${it.qty} ${it.name}${it.milk ? `, ${it.milk} milk` : ''}. Anything else to add?` : `${it.qty} ${it.name}${it.milk ? ` with ${it.milk} milk` : ''}. What else?`);
    });
    say(CU, o.note ? `That's it. ${o.note}` : `No, that's everything.`);
    say(AI, `Perfect. Can I get a name for the order?`);
    say(CU, `${nm}.`);
    say(AI, `Thanks, ${nm}. It'll be ready in about ${o.pickupMin} minutes at ${cfg.street}. Your total is ${money.format(o.total)} with tax, and you'll pay when you pick it up. ${G.closing}`);
    say(CU, `No, that's all. Thank you!`);
    say(AI, `See you soon, ${nm}!`);
  } else if (c.type === 'hours') {
    say(CU, K.rnd() < 0.5 ? `Hey, how late are you open tonight?` : `Hi, what are your hours?`);
    say(AI, `We're open ${cfg.hoursText}. ${G.closing}`);
    say(CU, `That's it, thanks.`);
  } else if (c.type === 'location') {
    const q = K.pick(['where', 'parking', 'address']);
    say(CU, { where: `Where exactly are you located?`, parking: `Is there parking at your location?`, address: `What's your address?` }[q]);
    say(AI, `${locationAnswer(cfg, q === 'parking')} ${G.closing}`);
    say(CU, `Perfect, see you soon.`);
  } else if (c.type === 'menu') {
    const q = K.weighted([['milk', 4], ['best', 4], ['item', 3]]);
    if (q === 'milk') { say(CU, `Do you have non-dairy milk?`); say(AI, `Yes, we have oat, almond, soy and skim milk. ${G.closing}`); }
    else if (q === 'best') { say(CU, `What do people usually get there?`); say(AI, `Some of our most popular drinks are the Qamaria Latte, Pistachio Latte, Adeni Tea and the Mango Dragonfruit Refresher. ${G.closing}`); }
    else { const it = K.pick(G.menu.filter((m) => m.best)); say(CU, `Do you have the ${it.name} today?`); say(AI, `Yes, the ${it.name} is on our menu. ${PH ? 'I can put in a pickup order for you if you like.' : 'You can order it in store.'} ${G.closing}`); }
    say(CU, `No, that's it. Thanks!`);
  } else if (c.type === 'reserve') {
    say(CU, `Can I book a table for ${K.pick([4, 5, 6, 8])} on ${K.pick(['Friday', 'Saturday', 'Sunday'])} evening?`);
    say(AI, `We don't take reservations, but you're welcome to come by any time. We're open ${cfg.hoursText}. ${G.closing}`);
    say(CU, `Okay, we'll just come by. Thanks.`);
  } else if (c.type === 'catering') {
    say(CU, `Hi, do you do catering for events?`);
    say(AI, `For catering, please email our team at ${G.cateringEmail} and they'll take care of you. ${G.closing}`);
    say(CU, `Great, I'll send an email. Thanks.`);
  } else if (c.type === 'online') {
    say(CU, `Can I order online for pickup?`);
    say(AI, `We don't have online ordering. ${PH ? `I can take your pickup order right now over the phone, and you pay when you pick it up.` : `Orders are placed in person at the café.`} ${G.closing}`);
    say(CU, K.pick([`Oh okay, I'll just come in.`, `No worries, I'll call back when I'm ready to order.`]));
  } else if (c.type === 'staff') {
    const why = K.pick(['I think I left my sunglasses there yesterday', 'I wanted to ask about job openings', 'I have a question about a gift card', 'I wanted to give some feedback about my visit']);
    say(CU, `Hi, ${why}.`);
    say(AI, `Thanks for letting us know, I'll pass a message to the team. Can I get your name?`);
    say(CU, `It's ${nm}.`);
    say(AI, `Thanks, ${nm}. The team will call you back at this number. ${G.closing}`);
    say(CU, `No, that's all. Thanks.`);

}
function timeLines(lines, dur) {

  return lines.map((l, i) => { const at = t; t += (w[i] / tot) * dur; return { ...l, at }; });
}
function summary(c) {

    case 'catering': return `${nm} asked about catering. The AI referred them to ${CONFIG.cateringEmail}.`;

    case 'staff': return `${nm} left a message for the team. Staff should call back.`;
    case 'hangup': return c.afterHours ? 'Call came in after hours; the caller hung up.' : 'The caller hung up before saying anything.';
  }
}

let chartN = 0;
function niceTop(max) { const steps = [1, 2, 2.5, 5, 10]; const mag = Math.pow(10, Math.floor(Math.log10(Math.max(1, max / 4)))); for (const s of steps) { if (s * mag * 4 >= max) return s * mag * 4; } return Math.ceil(max / 4) * 4; }
// labels: x-axis labels; titles: full label per point (tooltip); lines: [{ name, values, color, fill, width }]
// Hover (or tap) anywhere on a chart to see every value at that point; click a legend item to hide/show a line.
const CHARTS = {};
function lineChart({ labels, titles, lines, h = 260 }) {
  const W = 760, H = h, P = { l: 40, r: 16, t: 26, b: 30 }, n = labels.length;
  const top = niceTop(Math.max(1, ...lines.flatMap((l) => l.values)) * 1.12);
  const x = (i) => P.l + (W - P.l - P.r) * (n === 1 ? 0.5 : i / (n - 1));
  const y = (v) => P.t + (H - P.t - P.b) * (1 - v / top);
  const id = 'c' + (++chartN);
  CHARTS[id] = { n, W, H, P, top, labels, titles, lines };
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = (top / 4) * k; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${num.format(v)}</text>`; }
  const every = Math.max(1, Math.ceil(n / 8));
  labels.forEach((lab, i) => {
    const last = i === n - 1;
    if ((i % every === 0 && n - 1 - i >= every * 0.75) || last) g += `<text x="${x(i)}" y="${H - 9}" text-anchor="${last && n > 1 ? 'end' : i === 0 && n > 1 ? 'start' : 'middle'}">${lab}</text>`;
  });
  lines.forEach((ln, li) => {
    const pts = ln.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    let s2 = '';
    if (ln.fill) s2 += `<defs><linearGradient id="${id}-${li}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${ln.color}" stop-opacity=".30"/><stop offset="1" stop-color="${ln.color}" stop-opacity="0"/></linearGradient></defs><polygon points="${x(0)},${y(0)} ${pts} ${x(n - 1)},${y(0)}" fill="url(#${id}-${li})"/>`;
    s2 += `<polyline points="${pts}" fill="none" stroke="${ln.color}" stroke-width="${ln.width || 2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += `<g class="ser s${li}">${s2}</g>`;
  });
  return `<div class="chartbox" data-chart="${id}">
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${h}px">${g}</svg>
    <div class="guide" hidden></div>${lines.map((ln, li) => `<i class="hdot s${li}" style="border-color:${ln.color}" hidden></i>`).join('')}
    <div class="ctip" hidden></div>
    <div class="legend">${lines.map((ln, li) => `<button class="lg" data-series="${li}"><i style="background:${ln.color}"></i>${esc(ln.name)}</button>`).join('')}<span class="hint">Hover a point to see the numbers</span></div>
  </div>`;
}
function chartHover(box, clientX) {
  const C = CHARTS[box.dataset.chart]; if (!C) return;
  const svg = box.querySelector('svg'), r = svg.getBoundingClientRect(), br = box.getBoundingClientRect();
  const fx = (clientX - r.left) / r.width * C.W;
  const i = Math.max(0, Math.min(C.n - 1, Math.round((fx - C.P.l) / (C.W - C.P.l - C.P.r) * (C.n - 1))));
  const px = (C.P.l + (C.W - C.P.l - C.P.r) * (C.n === 1 ? 0.5 : i / (C.n - 1))) / C.W * r.width + (r.left - br.left);
  const py = (v) => (C.P.t + (C.H - C.P.t - C.P.b) * (1 - v / C.top)) / C.H * r.height + (r.top - br.top);
  const guide = box.querySelector('.guide');
  guide.hidden = false; guide.style.left = px + 'px'; guide.style.top = (r.top - br.top + C.P.t / C.H * r.height) + 'px'; guide.style.height = ((C.H - C.P.t - C.P.b) / C.H * r.height) + 'px';
  C.lines.forEach((ln, li) => { const d = box.querySelector(`.hdot.s${li}`); d.hidden = box.classList.contains('hide-' + li); d.style.left = px + 'px'; d.style.top = py(ln.values[i]) + 'px'; });
  const tip = box.querySelector('.ctip');
  tip.innerHTML = `<b>${esc(C.titles[i])}</b>${C.lines.map((ln, li) => box.classList.contains('hide-' + li) ? '' : `<div><i style="background:${ln.color}"></i>${esc(ln.name)}<span>${num.format(ln.values[i])}</span></div>`).join('')}`;
  tip.hidden = false;
  const tw = tip.offsetWidth;
  tip.style.left = (px + 14 + tw > br.width ? px - 14 - tw : px + 14) + 'px';
  tip.style.top = Math.max(0, Math.min(...C.lines.map((ln) => py(ln.values[i]))) - 20) + 'px';
}
function chartLeave(box) { box.querySelectorAll('.guide,.hdot,.ctip').forEach((e) => { e.hidden = true; }); }

// one bucket per day of month m, in this location's time zone
function dayBuckets(L, m) {
  const out = [];
  for (let d = 1; d <= daysIn(m); d++) {
    const s = L.mid(L.Y, m, d);
    if (s > NOW) break;
    const inB = L.inRange(s, Math.min(s + DAY, NOW + 1));
    out.push({ s, label: s === L.todayStart ? 'Today' : L.fmtShortDay(s), calls: inB.length, handled: inB.filter(handled).length, orders: inB.filter(isOrder).length });
  }
  return out;
}
function monthStats(L, m) {
  const list = L.monthCalls(m), ord = list.filter(isOrder);
  return { m, list, calls: list.length, handled: list.filter(handled).length, orders: ord.length, value: sum(ord, (c) => c.order.total), mins: L.minutes(list), days: m === CUR_M ? (NOW - L.mid(L.Y, m, 1)) / DAY : daysIn(m) };
}

function resolveBars(list) {
  const total = list.length;
  const groups = [['Order taken', 'var(--accent-2)'], ['Question answered', 'var(--info)'], ['Referred to email', 'var(--warn)'], ['Message for staff', '#ff9a76'], ['Hung up', 'var(--bad)']];
  return groups.map(([o, col]) => {
    const n = list.filter((c) => TYPES[c.type].outcome === o).length;
    if (!n) return '';
    return `<div class="item"><div class="t"><b>${o}</b><span>${pctOf(n, total)}% · ${num.format(n)} calls</span></div><div class="track"><div class="fill" style="width:${(n / total * 100).toFixed(1)}%;background:${col}"></div></div></div>`;
  }).join('');
}
function reasonRows(list) {
  const counts = {};
  list.forEach((c) => { const r = TYPES[c.type].reason; counts[r] = (counts[r] || 0) + 1; });
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 7);
  if (!rows.length) return '<div class="muted">No calls yet.</div>';
  return rows.map(([r, n]) => `<div class="r"><span>${r}</span><span class="mini"><i style="width:${n / rows[0][1] * 100}%"></i></span><span class="n">${num.format(n)}</span></div>`).join('');
}
function usageBar(used, total) {
  const pct = used / total;
  return `<div class="minibar"><div class="tr"><i style="width:${Math.min(100, pct * 100)}%;background:${pct > 0.85 ? 'var(--warn)' : 'var(--accent-2)'}"></i></div><span class="muted">${num.format(used)} · ${Math.round(pct * 100)}%</span></div>`;
}

  </div>

/* ---------------- calls ---------------- */
function rangeOptions() {
  return [['today', 'Today'], ['yesterday', 'Yesterday'], ['7', 'Last 7 days'], ...MONTHS.map((m) => ['m' + m, monthLabel(m)])];
}
function filteredCalls(L) {
  let list;
  const r = S.callRange;
  if (r === 'today') list = L.today;
  else if (r === 'yesterday') list = L.yesterday;
  else if (r === '7') list = L.inRange(L.todayStart - 6 * DAY, NOW + 1);
  else list = L.monthCalls(Number(r.slice(1)));
  if (S.outcome !== 'all') list = list.filter((c) => TYPES[c.type].outcome === S.outcome);
  if (S.q) { const q = S.q.toLowerCase(); list = list.filter((c) => (c.named && c.caller.name.toLowerCase().includes(q)) || c.caller.phone.includes(q) || TYPES[c.type].reason.toLowerCase().includes(q) || (c.order && (c.order.id.toLowerCase().includes(q) || c.order.items.some((i) => i.name.toLowerCase().includes(q))))); }
  return list;
}
function callsView(L) {
  const list = filteredCalls(L);
  const per = 25, pages = Math.max(1, Math.ceil(list.length / per));
  S.page = Math.min(S.page, pages - 1);
  const slice = list.slice(S.page * per, S.page * per + per);
  const outcomes = ['all', ...new Set(Object.values(TYPES).filter((t) => t.w > 0).map((t) => t.outcome))];
  return `
  <div class="h"><div><h2>Calls</h2><p>${esc(L.cfg.name)} · ${num.format(list.length)} calls · click any call to listen and read the transcript</p></div></div>
  <div class="card">
    <div class="filters">
      <input class="search" id="q" placeholder="Search by name, phone, reason, order or drink…" value="${esc(S.q)}" />
      <select id="crange" aria-label="Date range">${rangeOptions().map(([k, l]) => `<option value="${k}" ${S.callRange === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select id="outcome" aria-label="Outcome">${outcomes.map((o) => `<option value="${o}" ${S.outcome === o ? 'selected' : ''}>${o === 'all' ? 'All outcomes' : o}</option>`).join('')}</select>
    </div>
    <div class="tablewrap">${callTable(slice, {})}</div>
    <div class="pager"><span>Page ${S.page + 1} of ${pages}</span><span><button data-page="-1" ${S.page === 0 ? 'disabled' : ''}>‹ Prev</button> <button data-page="1" ${S.page >= pages - 1 ? 'disabled' : ''}>Next ›</button></span></div>
  </div>`;
}
function callTable(list, { compact, showLoc }) {
  if (!list.length) return '<div class="muted" style="padding:20px 4px">No calls match these filters.</div>';
  return `<table><thead><tr><th>Caller</th>${showLoc ? '<th>Location</th>' : ''}<th>When</th><th>Reason</th><th>Outcome</th>${compact ? '' : '<th class="num">Order</th>'}${showLoc ? '' : '<th class="num">Duration</th>'}</tr></thead><tbody>
  ${list.map((c) => { const L = LOCS[c.loc]; return `<tr data-call="${c.id}">
    <td><div class="who2"><b>${c.named ? esc(c.caller.name) : 'Unknown caller'}</b><span>${c.caller.phone}</span></div></td>
    ${showLoc ? `<td><span class="locdot" style="background:${L.cfg.color}"></span>${esc(L.cfg.city)}</td>` : ''}
    <td>${c.ts >= L.todayStart ? `${L.timeLabel(c.ts)} <span class="muted">· ${L.ago(c.ts)}</span>` : L.whenLabel(c.ts)}</td>
    <td>${TYPES[c.type].reason}${c.afterHours ? '<span class="tag">after hours</span>' : ''}</td>
    <td><span class="chip ${TYPES[c.type].chip}">${TYPES[c.type].outcome}</span></td>

    ${showLoc ? '' : `<td class="num">${durFmt(c.dur)}</td>`}</tr>`; }).join('')}
  </tbody></table>`;
}

          ${PH ? `<td class="num">${num.format(s.orders)}</td><td class="num">${money.format(s.value)}</td>` : ''}
          </tr>`).join('')}
        ${S.extra.map((x) => `<tr style="cursor:default"><td><div class="who2"><b>${esc(x.name)}</b><span>${esc(x.city)} · invite sent to ${esc(x.email)}</span></div></td><td><span class="chip c-setup">Setting up</span></td><td>${CONFIG.plans.find((p) => p.id === x.plan).name}</td><td><span class="muted">Not live yet</span></td><td class="num muted">—</td><td class="num muted">—</td>${PH ? '<td class="num muted">—</td><td class="num muted">—</td>' : ''}</tr>`).join('')}
      </tbody></table></div></div>
  <div class="grid two" style="margin-top:14px">
    <div class="grid">
      <div class="card"><h3>Calls per day by location</h3><div class="sub">${monthLabel(m)}</div>
        ${lineChart({ labels, titles: B[0].slice(0, n).map((b) => REF.fmtDay(b.s) + (b.s === REF.todayStart ? ' (today so far)' : '')), lines: st.map((s, i) => ({ name: s.L.cfg.city, values: B[i].slice(0, n).map((b) => b.calls), color: s.L.cfg.color, fill: i === 0 })) })}</div>
      <div class="card"><div class="row-head" style="align-items:center"><div><h3>${cur ? 'Latest calls' : `Last calls in ${monthName(m)}`}</h3><div class="sub">Both locations · click a call to hear it</div></div></div>
        <div class="tablewrap" style="margin-top:8px">${callTable(latest, { compact: true, showLoc: true })}</div></div>
    </div>
    <div class="grid">
      <div class="card reasons"><h3>Why people call</h3><div class="sub">Both locations · ${monthName(m)}</div><div style="margin-top:8px">${reasonRows(all)}</div></div>
      <div class="card resolve"><h3>How calls ended</h3><div class="sub">${num.format(T.calls)} calls</div>${resolveBars(all)}</div>
    </div>
  </div>`;
}
function locationsView() {
  return `
  <div class="h"><div><h2>Locations</h2><p>${CONFIG.brand} · ${LOC_IDS.length + S.extra.length} locations</p></div><button class="btn" data-act="add">+ Add location</button></div>
  <div class="grid halves">
    ${LOC_IDS.map((id) => { const L = LOCS[id], c = L.cfg, st = monthStats(L, CUR_M); return `
    <div class="card loccard">
      <div class="lh"><div class="lav" style="background:var(--accent-soft);color:${c.color}">${c.prefix}</div><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.address)}</div></div><span class="chip c-live" style="margin-left:auto">Live</span></div>
      <div class="stats"><div><b>${L.today.length}</b><span>calls today</span></div><div><b>${L.today.filter(isOrder).length}</b><span>orders today</span></div><div><b>${pctOf(st.mins, L.plan.minutes)}%</b><span>of ${L.plan.name} minutes</span></div></div>
      <div class="facts"><div><span>Hours</span>${esc(c.hoursText.charAt(0).toUpperCase() + c.hoursText.slice(1))}</div><div><span>Phone orders</span>Pickup, pay in store</div><div><span>POS</span>Toast</div><div><span>Plan</span>${L.plan.name} · ${num.format(L.plan.minutes)} min</div></div>
      <div class="actions" style="justify-content:flex-start"><button class="btn" data-scope="${id}">Open dashboard</button><button class="btn ghost" data-scope="${id}" data-goto="calls">View calls</button></div>
    </div>`; }).join('')}
    ${S.extra.map((x) => `<div class="card loccard"><div class="lh"><div class="lav" style="background:var(--panel-2);color:var(--muted)">+</div><div><h3>${esc(x.name)}</h3><div class="sub">${esc(x.city)}</div></div><span class="chip c-setup" style="margin-left:auto">Setting up</span></div><p class="muted" style="margin-top:12px">Invite sent to ${esc(x.email)}. Calls show up here once the AI receptionist goes live.</p></div>`).join('')}
  </div>`;
}
function ownerReportsView() {
  const ms = MONTHS.slice().reverse();
  const rows = ms.map((m) => ({ m, s: LOC_IDS.map((id) => monthStats(LOCS[id], m)) }));
  const labs = ms.map((m) => fMonthShort.format(Date.UTC(REF.Y, m, 15)) + (m === CUR_M ? ' (to date)' : ''));
  return `
  <div class="h"><div><h2>Reports</h2><p>Both locations · ${monthName(ms[0])} 1 to ${REF.fmtShortDay(NOW)}</p></div></div>
  <div class="card"><h3>Calls per month by location</h3><div class="sub">${monthName(CUR_M)} is month to date</div>
    ${lineChart({ labels: labs, titles: rows.map((r) => monthLabel(r.m)), lines: LOC_IDS.map((id, i) => ({ name: LOCS[id].cfg.city, values: rows.map((r) => r.s[i].calls), color: LOCS[id].cfg.color, fill: i === 0 })) })}</div>
  <div class="card" style="margin-top:14px"><h3>Month by month</h3><div class="sub">Minutes are out of ${num.format(REF.plan.minutes)} per location (${REF.plan.name} plan) · click a month to open it</div>
    <div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>Month</th>${LOC_IDS.map((id) => `<th class="num">${esc(LOCS[id].cfg.city)} calls</th>`).join('')}<th class="num">Total calls</th><th class="num">Answered</th>${PH ? '<th class="num">Orders</th><th class="num">Order value</th>' : ''}${LOC_IDS.map((id) => `<th class="num">${esc(LOCS[id].cfg.city)} minutes</th>`).join('')}</tr></thead><tbody>
    ${rows.slice().reverse().map((r) => { const c = sum(r.s, (s) => s.calls); return `<tr data-month="${r.m}"><td><b>${monthLabel(r.m)}</b></td>${r.s.map((s) => `<td class="num">${num.format(s.calls)}</td>`).join('')}<td class="num">${num.format(c)}</td><td class="num">${pctOf(sum(r.s, (s) => s.handled), c)}%</td>${PH ? `<td class="num">${num.format(sum(r.s, (s) => s.orders))}</td><td class="num">${money.format(sum(r.s, (s) => s.value))}</td>` : ''}${r.s.map((s, i) => { const pc = pctOf(s.mins, LOCS[LOC_IDS[i]].plan.minutes); return `<td class="num">${num.format(s.mins)} <span class="muted">· ${pc}%</span></td>`; }).join('')}</tr>`; }).join('')}
    </tbody></table></div></div>`;
}
function addModal() {
  const m = $('#modal');
  m.hidden = false;
  m.innerHTML = `<div class="box" role="dialog" aria-modal="true">
    <h3>Add a location</h3><p class="muted">The location manager gets an invite to set their password.</p>
    <div class="field"><label>Location name</label><input id="f-name" placeholder="e.g. Qamaria Calgary" /></div>
    <div class="field"><label>City</label><input id="f-city" placeholder="e.g. Calgary" /></div>
    <div class="field"><label>Plan (included minutes per month)</label><div class="pkgs">${CONFIG.plans.map((p) => `<button class="pkg ${S.addPlan === p.id ? 'on' : ''}" data-plan="${p.id}"><b>${p.name}</b><span>${num.format(p.minutes)} min</span></button>`).join('')}</div></div>
    <div class="field"><label>Manager email</label><input id="f-email" placeholder="manager@example.com" /></div>
    <div class="actions"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="save">Add and send invite</button></div>
  </div>`;
  setTimeout(() => $('#f-name').focus(), 30);
}

/* ---------------- call drawer with transcript-led playback ---------------- */
let playTimer = null;
function openCall(id) {
  const c = ALL.get(id);
  if (!c) return;
  const L = LOCS[c.loc];
  const lines = transcript(c);
  const bars = Array.from({ length: 64 }, (_, i) => 18 + Math.abs(Math.sin(i * 1.7 + c.dur) * 60 + Math.sin(i * 0.43) * 20));
  const d = $('#drawer');
  d.innerHTML = `
    <div class="dh"><div><h3>${c.named ? esc(c.caller.name) : 'Unknown caller'} <span class="chip ${TYPES[c.type].chip}" style="margin-left:6px;vertical-align:2px">${TYPES[c.type].outcome}</span></h3>
      <div class="meta">${esc(L.cfg.name)} · ${c.caller.phone} · ${L.whenLabel(c.ts)} · ${durFmt(c.dur)}</div></div>
      <button class="x" data-act="closecall" aria-label="Close">×</button></div>
    <div class="db">
      <div class="player"><button class="pb" data-act="play" aria-label="Play">▶</button>
        <div class="wave">${bars.map((h) => `<i style="height:${Math.min(100, h)}%"></i>`).join('')}</div>
        <div class="tm" id="ptm">0:00 / ${clockFmt(c.dur)}</div></div>
      <div class="sect"><div class="lab">AI summary</div><div class="summary">${esc(summary(c))}</div></div>
      ${c.order ? `<div class="sect"><div class="lab">Order taken</div>${ticketHTML(c).replace('class="ticket"', 'class="ticket" style="cursor:default"')}</div>` : ''}
      <div class="sect"><div class="lab">Details</div><div class="facts">
        <div><span>Reason</span>${TYPES[c.type].reason}</div><div><span>Outcome</span>${TYPES[c.type].outcome}</div>
        <div><span>Call ID</span><span style="color:var(--text);font-family:var(--mono)">${c.id}</span></div><div><span>Minutes billed</span>${(c.dur / 60).toFixed(1)}</div>
      </div></div>
      <div class="sect"><div class="lab">Transcript</div><div class="tx">${lines.map((l, i) => `<div class="ln" data-at="${l.at}" id="ln${i}"><span class="ts">${clockFmt(l.at)}</span><span class="sp ${l.who === 'AI' ? 'ai' : 'cu'}">${l.who === 'AI' ? 'AI' : 'Caller'}</span><span>${esc(l.text)}</span></div>`).join('')}</div></div>
    </div>`;
  d.dataset.id = id; d.dataset.t = 0;
  d.classList.add('on'); $('#scrim').classList.add('on');
  stopPlay();
}
function stopPlay() { clearInterval(playTimer); playTimer = null; const b = $('#drawer .pb'); if (b) b.textContent = '▶'; }
function togglePlay() {
  const d = $('#drawer'); const c = ALL.get(d.dataset.id);
  if (playTimer) { stopPlay(); return; }
  let t = Number(d.dataset.t || 0); if (t >= c.dur) t = 0;
  $('#drawer .pb').textContent = '❚❚';
  const bars = [...d.querySelectorAll('.wave i')], lines = [...d.querySelectorAll('.tx .ln')];
  playTimer = setInterval(() => {
    t += 0.25; d.dataset.t = t;
    const f = Math.min(1, t / c.dur);
    bars.forEach((b, i) => b.classList.toggle('p', i / bars.length <= f));
    $('#ptm').textContent = `${clockFmt(t)} / ${clockFmt(c.dur)}`;
    let cur = 0; lines.forEach((l, i) => { if (Number(l.dataset.at) <= t) cur = i; });
    lines.forEach((l, i) => l.classList.toggle('hl', i === cur));
    if (t >= c.dur) stopPlay();
  }, 250);
}
function closeCall() { stopPlay(); $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); }

/* ---------------- events ---------------- */
function goScope(scope, view) {
  S.scope = scope; S.menu = false; S.page = 0; S.q = ''; S.outcome = 'all';
  S.view = view || (scope === 'all' ? 'owner' : 'overview');
  S.callRange = 'm' + S.month;
  closeCall(); render(); window.scrollTo(0, 0);
}
function signOut() { S.stage = 'signin'; S.menu = false; S.month = CUR_M; closeCall(); render(); }

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'signin') return;
  e.preventDefault();
  // any email and password (or none) signs in; there is no real account check
  S.email = $('#si-email').value.trim() || 'anwar@qamaria.ca';
  const b = $('#si-go'); b.disabled = true; b.textContent = 'Signing in…';
  setTimeout(() => { S.stage = 'pick'; render(); }, 650);
});
document.addEventListener('click', (e) => {
  const lg = e.target.closest('.lg[data-series]');
  if (lg) { const box = lg.closest('.chartbox'); box.classList.toggle('hide-' + lg.dataset.series); chartLeave(box); return; }
  const el = e.target.closest('[data-pick],[data-scope],[data-view],[data-act],[data-call],[data-page],[data-plan],[data-month]');
  if (S.menu && !e.target.closest('.acctwrap')) { S.menu = false; const mm = $('#acctmenu'); if (mm) mm.hidden = true; const ab = $('.acctbtn'); if (ab) ab.classList.remove('on'); }
  if (!el) { if (e.target.id === 'scrim') closeCall(); if (e.target.id === 'modal') { $('#modal').hidden = true; } return; }
  if (el.dataset.pick) { S.stage = 'app'; goScope(el.dataset.pick); return; }
  if (el.dataset.scope) { goScope(el.dataset.scope, el.dataset.goto); return; }
  if (el.dataset.view) { S.view = el.dataset.view; if (S.view === 'calls') { S.callRange = 'm' + S.month; S.page = 0; } render(); window.scrollTo(0, 0); return; }
  if (el.dataset.month) { S.month = Number(el.dataset.month); S.view = S.scope === 'all' ? 'owner' : 'overview'; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.page) { S.page += Number(el.dataset.page); render(); return; }
  if (el.dataset.plan) { S.addPlan = el.dataset.plan; document.querySelectorAll('.pkg').forEach((p) => p.classList.toggle('on', p.dataset.plan === S.addPlan)); return; }
  if (el.dataset.call) { openCall(el.dataset.call); return; }
  const a = el.dataset.act;
  if (a === 'acct') { S.menu = !S.menu; $('#acctmenu').hidden = !S.menu; el.classList.toggle('on', S.menu); el.setAttribute('aria-expanded', S.menu); }
  else if (a === 'signout') signOut();
  else if (a === 'forgot') toast('Your RezFlo contact can send you a reset link.');
  else if (a === 'closecall') closeCall();
  else if (a === 'play') togglePlay();
  else if (a === 'add') addModal();
  else if (a === 'close') $('#modal').hidden = true;
  else if (a === 'save') {
    const name = $('#f-name').value.trim() || 'New location';
    const email = $('#f-email').value.trim() || 'the manager';
    S.extra.push({ name, city: $('#f-city').value.trim() || '—', email, plan: S.addPlan });
    $('#modal').hidden = true; render();
    toast(`${name} added. Invite sent to ${email}.`);
  }
});
document.addEventListener('pointermove', (e) => {
  const box = e.target.closest && e.target.closest('.chartbox');
  if (chartHover.active && chartHover.active !== box) { chartLeave(chartHover.active); chartHover.active = null; }
  if (box && !e.target.closest('.legend')) { chartHover.active = box; chartHover(box, e.clientX); }
});
document.addEventListener('pointerdown', (e) => { const box = e.target.closest('.chartbox'); if (box && !e.target.closest('.legend')) { chartHover.active = box; chartHover(box, e.clientX); } });
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; S.page = 0; const pos = e.target.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'outcome') { S.outcome = e.target.value; S.page = 0; render(); }
  if (e.target.id === 'crange') { S.callRange = e.target.value; S.page = 0; if (S.callRange[0] === 'm') S.month = Number(S.callRange.slice(1)); render(); }
  if (e.target.id === 'month') { S.month = Number(e.target.value); render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCall(); $('#modal').hidden = true; if (S.menu) { S.menu = false; const mm = $('#acctmenu'); if (mm) mm.hidden = true; } } });

render();
</script>
</body>
